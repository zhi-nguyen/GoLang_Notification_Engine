version: '3.8'

services:
  nats:
    image: nats:2.10-alpine
    container_name: nats-server
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/varz"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: notifications
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_create_notifications.sql:/docker-entrypoint-initdb.d/001_create_notifications.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: notification-backend
    ports:
      - "8080:8080"
    environment:
      - API_PORT=8080
      - DATABASE_URL=postgres://user:pass@postgres:5432/notifications?sslmode=disable
      - NATS_URL=nats://nats:4222
      - JWT_SECRET=change-me-in-production-super-secret-key-32-bytes
      - LOG_LEVEL=info
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
