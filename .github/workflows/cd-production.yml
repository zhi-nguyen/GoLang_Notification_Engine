name: CD Pipeline - Production

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Release Tag
        id: vars
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build Docker Backend Image
        run: |
          docker build -t gonotification-backend:${{ env.TAG }} -f Dockerfile.backend .

      - name: Deploy Production Placeholder
        run: |
          echo "Deploying version ${{ env.TAG }} to Production..."
          echo "Production deployment placeholder - ready for Kubernetes/ECS deployment."
