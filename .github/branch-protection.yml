# Branch Protection Configuration Reference
# Configure these rules in GitHub Repository Settings -> Branches

protected_branches:
  main:
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
    required_status_checks:
      strict: true
      contexts:
        - "Lint Go Code"
        - "Run Unit Tests"
        - "Build Verification"
    enforce_admins: true
    allow_force_pushes: false
    allow_deletions: false

  staging:
    required_pull_request_reviews:
      required_approving_review_count: 1
    required_status_checks:
      strict: true
      contexts:
        - "Run Unit Tests"
        - "Build Verification"
    allow_force_pushes: false

  dev:
    required_status_checks:
      strict: true
      contexts:
        - "Run Unit Tests"
    allow_force_pushes: false
